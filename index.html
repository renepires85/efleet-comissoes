<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>SEVEN — Task Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.8.0/Recharts.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f5f0;--bg2:#eeeee8;--surface:#fff;--surface2:#f9f9f6;
  --border:#e2e2da;--border2:#c8c8be;--text:#1a1a18;--text-dim:#6b6b60;--text-muted:#a8a89a;
  --accent:#e8470a;--accent-soft:#fff0eb;--accent2:#ff6b35;
  --todo:#2563eb;--todo-soft:#eff6ff;--doing:#d97706;--doing-soft:#fffbeb;
  --done:#16a34a;--done-soft:#f0fdf4;--standby:#7c3aed;--standby-soft:#f5f3ff;
  --overdue:#dc2626;--overdue-soft:#fef2f2;--rec:#0891b2;--rec-soft:#ecfeff;
  --fh:'Syne',sans-serif;--fb:'DM Sans',sans-serif;
  --r:10px;--rl:16px;
  --s0:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --s1:0 4px 16px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.04);
  --s2:0 16px 48px rgba(0,0,0,.12),0 4px 12px rgba(0,0,0,.06);
  --tr:.18s cubic-bezier(.4,0,.2,1);
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--fb);font-size:14px;line-height:1.5}
#root{height:100%}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px}
.app{display:flex;flex-direction:column;min-height:100vh}

/* HEADER */
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 28px;height:58px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100;box-shadow:var(--s0)}
.logo{font-family:var(--fh);font-size:17px;font-weight:800;color:var(--text);display:flex;align-items:center;gap:9px}
.logo-mark{width:28px;height:28px;border-radius:7px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;font-family:var(--fh)}
.logo-sub{font-size:10px;font-weight:500;color:var(--text-muted);letter-spacing:1.5px;text-transform:uppercase}
.hdiv{width:1px;height:18px;background:var(--border)}
.hstats{display:flex;gap:5px;margin-left:auto}
.schip{display:flex;align-items:center;gap:5px;padding:4px 11px;border-radius:99px;background:var(--surface2);border:1px solid var(--border);font-size:11px;color:var(--text-dim);font-weight:500}
.schip strong{color:var(--text);font-weight:700}
.schip.ov{background:var(--overdue-soft);border-color:#fecaca}.schip.ov strong{color:var(--overdue)}
.dbadge{padding:3px 9px;border-radius:99px;background:var(--accent-soft);border:1px solid #fcd5c0;font-size:10px;color:var(--accent);font-weight:600}

/* NAV TABS */
.navtabs{background:var(--surface);border-bottom:1px solid var(--border);padding:0 28px;display:flex;gap:0}
.ntab{padding:10px 16px;border:none;background:transparent;font-family:var(--fb);font-size:13px;font-weight:500;color:var(--text-dim);cursor:pointer;border-bottom:2px solid transparent;transition:var(--tr)}
.ntab:hover{color:var(--text)}
.ntab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* TOOLBAR */
.toolbar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 28px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.swrap{position:relative;flex:1;min-width:180px}
.sico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:14px;pointer-events:none}
.sinput{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:7px 11px 7px 32px;color:var(--text);font-family:var(--fb);font-size:13px;outline:none;transition:var(--tr)}
.sinput:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px rgba(232,71,10,.08)}
.sinput::placeholder{color:var(--text-muted)}
.fpills{display:flex;gap:5px;flex-wrap:wrap}
.pill{padding:5px 12px;border-radius:99px;border:1px solid var(--border);background:var(--surface2);color:var(--text-dim);font-family:var(--fb);font-size:11px;font-weight:500;cursor:pointer;transition:var(--tr);white-space:nowrap}
.pill:hover{border-color:var(--border2);color:var(--text)}
.pill.active{color:#fff;border-color:transparent}
.pill.fa.active{background:var(--text)}.pill.ft.active{background:var(--todo)}.pill.fd.active{background:var(--doing)}
.pill.fs.active{background:var(--standby)}.pill.fo.active{background:var(--overdue)}.pill.fh.active{background:var(--accent)}.pill.f24.active{background:var(--done)}
.vtog{display:flex;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;background:var(--surface2)}
.vbtn{padding:6px 11px;border:none;background:transparent;color:var(--text-muted);cursor:pointer;font-size:14px;transition:var(--tr)}
.vbtn.active{background:var(--surface);color:var(--text);box-shadow:var(--s0)}
.btn{padding:7px 15px;border-radius:var(--r);border:none;cursor:pointer;font-family:var(--fb);font-size:13px;font-weight:500;transition:var(--tr);display:flex;align-items:center;gap:6px;white-space:nowrap}
.bp{background:var(--accent);color:#fff}.bp:hover{background:var(--accent2);box-shadow:0 4px 12px rgba(232,71,10,.28)}
.bg{background:var(--surface2);border:1px solid var(--border);color:var(--text-dim)}.bg:hover{color:var(--text);border-color:var(--border2)}
.bx{background:var(--overdue-soft);color:var(--overdue);border:1px solid #fecaca}.bx:hover{background:#fee2e2}
.bs{background:var(--done-soft);color:var(--done);border:1px solid #bbf7d0}

/* MAIN */
.main{flex:1;padding:22px 28px}
.cbanner{background:var(--accent-soft);border:1px solid #fcd5c0;border-radius:var(--r);padding:11px 16px;margin-bottom:18px;display:flex;align-items:center;gap:9px;font-size:12px;color:var(--text-dim)}
.cbanner strong{color:var(--accent)}.cbanner code{background:#fff;padding:1px 5px;border-radius:4px;font-size:11px;border:1px solid #fcd5c0}

/* KANBAN */
.kanban{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.kcol{min-width:275px;flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;box-shadow:var(--s0)}
.khead{display:flex;align-items:center;gap:7px;padding:13px 14px 11px;border-bottom:1px solid var(--border)}
.kstripe{width:3px;height:16px;border-radius:99px;flex-shrink:0}
.ktitle{font-family:var(--fh);font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text-dim)}
.kcount{margin-left:auto;background:var(--bg);border:1px solid var(--border);border-radius:99px;padding:1px 8px;font-size:10px;color:var(--text-muted);font-weight:600}
.kbody{padding:10px;display:flex;flex-direction:column;gap:7px}

/* COLLAPSED COL (Done + StandBy) */
.kcol-collapsed{min-width:200px;background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;box-shadow:var(--s0)}
.kcol-section{border-bottom:1px solid var(--border)}
.kcol-section:last-child{border-bottom:none}
.ksec-head{display:flex;align-items:center;gap:7px;padding:12px 14px;cursor:pointer;user-select:none;transition:var(--tr)}
.ksec-head:hover{background:var(--surface2)}
.ksec-arrow{font-size:10px;color:var(--text-muted);margin-left:auto;transition:var(--tr)}
.ksec-arrow.open{transform:rotate(90deg)}
.ksec-body{padding:10px;display:flex;flex-direction:column;gap:7px}

/* CARDS */
.card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:12px 13px;cursor:pointer;transition:var(--tr)}
.card:hover{border-color:var(--border2);box-shadow:var(--s1);transform:translateY(-1px)}
.card.ov{border-color:#fecaca;background:#fff8f8}.card.ov:hover{border-color:#fca5a5}
.cproj{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted);margin-bottom:4px}
.cname{font-size:13px;font-weight:500;line-height:1.4;color:var(--text);margin-bottom:9px}
.cmeta{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.cdate{font-size:10px;color:var(--text-muted)}.cdate.ov{color:var(--overdue);font-weight:600}.cdate.td{color:var(--doing);font-weight:600}
.crec{font-size:9px;color:var(--rec);font-weight:600;background:var(--rec-soft);padding:1px 6px;border-radius:4px}
.tag{font-size:9px;font-weight:600;padding:2px 6px;border-radius:4px}
.tc{background:var(--overdue-soft);color:var(--overdue)}.ti{background:var(--doing-soft);color:var(--doing)}
.tn{background:var(--bg2);color:var(--text-muted)}.tt{background:var(--bg);border:1px solid var(--border);color:var(--text-muted)}
.prog{margin-top:9px}
.pbar{height:3px;background:var(--bg2);border-radius:99px;overflow:hidden}
.pfill{height:100%;border-radius:99px;background:var(--done);transition:width .4s}
.plabel{font-size:9px;color:var(--text-muted);margin-top:2px}

/* LIST */
.lview{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;box-shadow:var(--s0)}
.lhead{display:grid;grid-template-columns:2fr 1fr 1fr 110px 110px;gap:10px;padding:9px 16px;background:var(--bg);border-bottom:1px solid var(--border);font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted)}
.lrow{display:grid;grid-template-columns:2fr 1fr 1fr 110px 110px;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);align-items:center;cursor:pointer;transition:var(--tr)}
.lrow:last-child{border-bottom:none}.lrow:hover{background:var(--surface2)}.lrow.ov{background:#fff8f8}
.lname{font-weight:500;font-size:13px}.lproj{font-size:11px;color:var(--text-dim)}
.sbadge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:5px;font-size:10px;font-weight:600}
.sdot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.sTodo{background:var(--todo-soft);color:var(--todo)}.sDoing{background:var(--doing-soft);color:var(--doing)}
.sDone{background:var(--done-soft);color:var(--done)}.sStandBy{background:var(--standby-soft);color:var(--standby)}.sRecorrente{background:var(--rec-soft);color:var(--rec)}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);backdrop-filter:blur(6px);z-index:200;display:flex;align-items:center;justify-content:center;animation:fi .15s ease;padding:18px}
@keyframes fi{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);width:100%;max-width:540px;max-height:90vh;overflow-y:auto;padding:26px;box-shadow:var(--s2);animation:su .2s cubic-bezier(.4,0,.2,1)}
@keyframes su{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}
.mtitle{font-family:var(--fh);font-size:17px;font-weight:700;line-height:1.3}
.mclose{width:28px;height:28px;border-radius:7px;border:1px solid var(--border);background:var(--surface2);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-muted);font-size:15px;transition:var(--tr);flex-shrink:0}
.mclose:hover{color:var(--text);border-color:var(--border2)}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dlabel{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted);margin-bottom:4px}
.dval{font-size:13px;color:var(--text)}
.slist{display:flex;flex-direction:column;gap:5px;margin-top:5px}
.sitem{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:7px;font-size:12px}
.sitem.dn{color:var(--text-muted)}.sitem.dn .sn{text-decoration:line-through}
.ci{color:var(--done);font-size:12px;flex-shrink:0}.ui{color:var(--text-muted);font-size:12px;flex-shrink:0}
.nlink{display:inline-flex;align-items:center;gap:4px;color:var(--accent);text-decoration:none;font-size:11px;font-weight:500}
.nlink:hover{text-decoration:underline}
.mact{display:flex;gap:7px;justify-content:flex-end;margin-top:22px;padding-top:16px;border-top:1px solid var(--border)}

/* FORM */
.fgrid{display:flex;flex-direction:column;gap:13px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.fg{display:flex;flex-direction:column;gap:4px}
.fl{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted)}
.fi,.fs{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:8px 11px;color:var(--text);font-family:var(--fb);font-size:13px;outline:none;transition:var(--tr);width:100%}
.fi:focus,.fs:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px rgba(232,71,10,.08)}

/* SUBTASK EDITOR */
.sted{display:flex;flex-direction:column;gap:6px}
.strow{display:flex;align-items:center;gap:7px;padding:7px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:8px}
.stcb{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--border2);appearance:none;cursor:pointer;flex-shrink:0;position:relative;transition:var(--tr)}
.stcb:checked{background:var(--done);border-color:var(--done)}
.stcb:checked::after{content:'✓';position:absolute;top:-1px;left:1px;font-size:10px;color:#fff;font-weight:700}
.stin{flex:1;background:transparent;border:none;outline:none;font-family:var(--fb);font-size:12px;color:var(--text)}
.stin.dn{text-decoration:line-through;color:var(--text-muted)}
.stx{background:transparent;border:none;cursor:pointer;color:var(--text-muted);font-size:14px;padding:0 2px;line-height:1}
.stx:hover{color:var(--overdue)}
.stadd{display:flex;align-items:center;gap:7px;padding:7px 10px;border:1px dashed var(--border2);border-radius:8px;cursor:pointer;color:var(--text-muted);font-size:12px;transition:var(--tr)}
.stadd:hover{border-color:var(--accent);color:var(--accent)}

/* RECURRENCE */
.recbox{background:var(--rec-soft);border:1px solid #a5f3fc;border-radius:var(--r);padding:12px}
.recrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.recpill{padding:5px 11px;border-radius:99px;border:1.5px solid var(--border2);background:var(--surface);font-size:11px;font-weight:500;cursor:pointer;color:var(--text-dim);transition:var(--tr)}
.recpill.active{background:var(--rec);border-color:var(--rec);color:#fff}
.recdays{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.rday{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--border2);background:var(--surface);font-size:11px;font-weight:600;cursor:pointer;color:var(--text-dim);display:flex;align-items:center;justify-content:center;transition:var(--tr)}
.rday.active{background:var(--rec);border-color:var(--rec);color:#fff}

/* DASHBOARD */
.dash{display:flex;flex-direction:column;gap:20px}
.drow{display:grid;gap:14px}
.drow2{grid-template-columns:1fr 1fr}
.drow3{grid-template-columns:1fr 1fr 1fr}
.drow4{grid-template-columns:repeat(4,1fr)}
.dcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:18px;box-shadow:var(--s0)}
.dcard-title{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted);margin-bottom:14px}
.kpi{font-family:var(--fh);font-size:32px;font-weight:800;color:var(--text);line-height:1}
.kpi-label{font-size:11px;color:var(--text-dim);margin-top:4px}
.kpi.red{color:var(--overdue)}.kpi.grn{color:var(--done)}.kpi.org{color:var(--doing)}.kpi.blu{color:var(--todo)}

/* EMPTY / LOADING */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:36px 18px;color:var(--text-muted);gap:7px}
.loading{display:flex;align-items:center;justify-content:center;padding:56px}
.spinner{width:26px;height:26px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .75s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* TOAST */
.tcon{position:fixed;bottom:18px;right:18px;z-index:999;display:flex;flex-direction:column;gap:5px}
.toast{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:10px 15px;font-size:12px;box-shadow:var(--s1);animation:su .2s ease;display:flex;align-items:center;gap:8px}
.toast.success{border-left:3px solid var(--done)}.toast.error{border-left:3px solid var(--overdue)}

@media(max-width:768px){
  .header,.toolbar,.main{padding-left:14px;padding-right:14px}
  .navtabs{padding:0 14px}
  .hstats{display:none}.kanban{gap:10px}.kcol{min-width:240px}
  .lhead{display:none}.lrow{grid-template-columns:1fr;gap:5px}
  .frow{grid-template-columns:1fr}.dgrid{grid-template-columns:1fr}
  .drow2,.drow3,.drow4{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useCallback,useRef}=React;

const API={url:'https://script.google.com/macros/s/SEU_SCRIPT_ID_AQUI/exec',key:'sevenC-2026'};

const DAYS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const REC_TYPES=[{v:'daily',l:'Diário'},{v:'weekly',l:'Semanal'},{v:'monthly',l:'Mensal'}];
const STATUS_ORDER=['To Do','Doing','StandBy','Recorrente','Done'];
const SC={'To Do':'#2563eb','Doing':'#d97706','Done':'#16a34a','StandBy':'#7c3aed','Recorrente':'#0891b2'};
const COLLAPSED_STATUSES=['Done','StandBy'];
const MAIN_STATUSES=['To Do','Doing','Recorrente'];

const hoje=new Date();hoje.setHours(0,0,0,0);
const isOv=t=>!['Done','StandBy'].includes(t.Status)&&t.Data&&new Date(t.Data)<hoje;
const isTd=t=>!['Done','StandBy'].includes(t.Status)&&t.Data&&new Date(t.Data).toDateString()===hoje.toDateString();
const is24h=t=>{
  if(t.Status!=='Done'||!t.UpdatedAt)return false;
  return(Date.now()-new Date(t.UpdatedAt).getTime())<86400000;
};
const fmtD=d=>{if(!d)return'—';return new Date(d+'T00:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})};
const priCls=p=>p?.includes('Crítico')?'tc':p?.includes('Importante')?'ti':'tn';
const isDemo=!API.url.includes('script.google.com/macros/s/')||API.url.includes('SEU_SCRIPT');

function parseSubs(str){
  if(!str)return[];
  return str.split(',').map(s=>{const[n,c]=s.split('|');return{nome:n?.trim(),done:c?.trim()==='✅'}}).filter(s=>s.nome);
}
function serializeSubs(arr){return arr.map(s=>`${s.nome}|${s.done?'✅':'☐'}`).join(',')}
function parseRec(str){
  if(!str)return null;
  try{return JSON.parse(str)}catch{return null}
}
function fmtRec(r){
  if(!r)return'';
  if(r.type==='daily')return'Todo dia';
  if(r.type==='weekly'&&r.days?.length)return'Toda '+r.days.map(d=>DAYS[d]).join(', ');
  if(r.type==='monthly'&&r.day)return`Todo dia ${r.day}`;
  return'';
}

const DEMO=[
  {ID:'d1',Nome:'BRPark',Projeto:'BRPark',Status:'To Do',Prioridade:'🔴 Crítico',Data:'2026-05-08',Tipo:'Follow-up',Categoria:'Receita',Subtarefas:'Reenviar Proposta|☐,Fechar|☐,Montar proposta|✅,Enviar Proposta|✅',Recorrencia:'',UpdatedAt:'2026-05-08T10:00:00'},

async function apiCall(action,params={},body=null){
  if(isDemo)return null;
  const url=new URL(API.url);
  url.searchParams.set('key',API.key);url.searchParams.set('action',action);
  Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,v));
  const res=await fetch(url.toString(),body?{method:'POST',body:JSON.stringify(body)}:{method:'GET'});
  return res.json();
}

/* ── COMPONENTS ── */
function SBadge({status}){
  const cls=(status||'').replace(' ','');
  return<span className={`sbadge s${cls}`}><span className="sdot" style={{background:SC[status]||'#999'}}/>{status||'—'}</span>
}
function SubProg({subs}){
  if(!subs?.length)return null;
  const d=subs.filter(s=>s.done).length,pct=Math.round((d/subs.length)*100);
  return<div className="prog"><div className="pbar"><div className="pfill" style={{width:`${pct}%`}}/></div><div className="plabel">{d}/{subs.length} concluídas</div></div>
}

function TaskCard({task,onClick}){
  const subs=parseSubs(task.Subtarefas),ov=isOv(task),td=isTd(task);
  const rec=parseRec(task.Recorrencia);
  return<div className={`card${ov?' ov':''}`} onClick={()=>onClick(task)}>
    {task.Projeto&&task.Projeto!==task.Nome&&<div className="cproj">{task.Projeto}</div>}
    <div className="cname">{task.Nome}</div>
    <div className="cmeta">
      {task.Data&&<div className={`cdate${ov?' ov':td?' td':''}`}>{ov?'⚠ ':td?'● ':''}{fmtD(task.Data)}</div>}
      {rec&&<span className="crec">↻ {fmtRec(rec)}</span>}
      {task.Prioridade&&task.Prioridade!=='⚪ Normal'&&<span className={`tag ${priCls(task.Prioridade)}`}>{task.Prioridade}</span>}
      {task.Tipo&&<span className="tag tt">{task.Tipo}</span>}
    </div>
    {subs.length>0&&<SubProg subs={subs}/>}
  </div>
}

  const[openSec,setOpenSec]=useState({Done:false,StandBy:false});
  const toggle=s=>setOpenSec(o=>({...o,[s]:!o[s]}));
  return<div className="kanban">
    {MAIN_STATUSES.map(status=>{
      const col=tasks.filter(t=>t.Status===status),color=SC[status]||'#999';
      return<div key={status} className="kcol">

  return<div className="sted">

/* ── DASHBOARD ── */
function Dashboard({tasks}){
  const total=tasks.length;
  const abertas=tasks.filter(t=>['To Do','Doing'].includes(t.Status)).length;
  const done=tasks.filter(t=>t.Status==='Done').length;
  const atrasadas=tasks.filter(isOv).length;
  const done24=tasks.filter(is24h).length;
  const taxa=total>0?Math.round((done/total)*100):0;

  // Por status
  const porStatus=STATUS_ORDER.map(s=>({name:s,value:tasks.filter(t=>t.Status===s).length,color:SC[s]}));

  // Por categoria
  const cats={};tasks.forEach(t=>{const c=t.Categoria||'Outros';cats[c]=(cats[c]||0)+1});
  const porCat=Object.entries(cats).map(([name,value])=>({name,value})).sort((a,b)=>b.value-a.value);

  // Entregas por dia (últimos 7 dias)
  const dias=[];
  for(let i=6;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);d.setHours(0,0,0,0);
    const label=d.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit'});
    const count=tasks.filter(t=>{
      if(t.Status!=='Done'||!t.UpdatedAt)return false;
      const u=new Date(t.UpdatedAt);u.setHours(0,0,0,0);
      return u.getTime()===d.getTime();
    }).length;
    dias.push({name:label,Entregas:count});
  }

  // Por prioridade
  const pris={'🔴 Crítico':0,'🟡 Importante':0,'⚪ Normal':0};
  tasks.forEach(t=>{if(pris[t.Prioridade]!==undefined)pris[t.Prioridade]++});

  const R=window.Recharts||{};
  const hasRecharts=!!R.BarChart;

  return<div className="dash">
    {/* KPIs */}
    <div className="drow drow4">
      <div className="dcard"><div className="dcard-title">Total de tarefas</div><div className="kpi blu">{total}</div><div className="kpi-label">cadastradas</div></div>
      <div className="dcard"><div className="dcard-title">Em aberto</div><div className="kpi org">{abertas}</div><div className="kpi-label">To Do + Doing</div></div>
      <div className="dcard"><div className="dcard-title">Concluídas</div><div className="kpi grn">{done}</div><div className="kpi-label">taxa: {taxa}%</div></div>
      <div className="dcard"><div className="dcard-title">Atrasadas</div><div className={`kpi${atrasadas>0?' red':''}`}>{atrasadas}</div><div className="kpi-label">{done24} entregues hoje</div></div>
    </div>

    {/* Gráfico entregas + Status */}
    <div className="drow drow2">
      <div className="dcard">
        <div className="dcard-title">Entregas nos últimos 7 dias</div>
        {hasRecharts?<R.BarChart width={340} height={180} data={dias} margin={{top:4,right:8,left:-20,bottom:0}}>
          <R.CartesianGrid strokeDasharray="3 3" stroke="var(--border)"/>
          <R.XAxis dataKey="name" tick={{fontSize:10,fill:'var(--text-muted)'}}/>
          <R.YAxis allowDecimals={false} tick={{fontSize:10,fill:'var(--text-muted)'}}/>
          <R.Tooltip contentStyle={{fontSize:12,borderRadius:8,border:'1px solid var(--border)'}}/>
          <R.Bar dataKey="Entregas" fill="var(--done)" radius={[4,4,0,0]}/>
        </R.BarChart>:<SimpleBar data={dias}/>}
      </div>
      <div className="dcard">
        <div className="dcard-title">Por status</div>
        <div style={{display:'flex',flexDirection:'column',gap:8,marginTop:4}}>
          {porStatus.filter(s=>s.value>0).map(s=><div key={s.name} style={{display:'flex',alignItems:'center',gap:9}}>
            <div style={{width:10,height:10,borderRadius:3,background:s.color,flexShrink:0}}/>
            <div style={{flex:1,fontSize:12,color:'var(--text-dim)'}}>{s.name}</div>
            <div style={{fontSize:13,fontWeight:700,color:'var(--text)'}}>{s.value}</div>
            <div style={{width:80,height:5,background:'var(--bg2)',borderRadius:99,overflow:'hidden'}}>
              <div style={{height:'100%',width:`${Math.round((s.value/total)*100)}%`,background:s.color,borderRadius:99}}/>
            </div>
          </div>)}
        </div>
      </div>
    </div>

    {/* Por categoria + Prioridade */}
    <div className="drow drow2">
      <div className="dcard">
        <div className="dcard-title">Por categoria</div>
        <div style={{display:'flex',flexDirection:'column',gap:7,marginTop:4}}>
          {porCat.map(c=><div key={c.name} style={{display:'flex',alignItems:'center',gap:9}}>
            <div style={{flex:1,fontSize:12,color:'var(--text-dim)'}}>{c.name}</div>
            <div style={{fontSize:13,fontWeight:700,color:'var(--text)'}}>{c.value}</div>
            <div style={{width:80,height:5,background:'var(--bg2)',borderRadius:99,overflow:'hidden'}}>
              <div style={{height:'100%',width:`${Math.round((c.value/total)*100)}%`,background:'var(--accent)',borderRadius:99}}/>
            </div>
          </div>)}
        </div>
      </div>
      <div className="dcard">
        <div className="dcard-title">Por prioridade</div>
        <div style={{display:'flex',flexDirection:'column',gap:12,marginTop:8}}>
          {Object.entries(pris).map(([k,v])=><div key={k} style={{display:'flex',alignItems:'center',gap:9}}>
            <div style={{flex:1,fontSize:12}}>{k}</div>
            <div style={{fontSize:13,fontWeight:700,color:'var(--text)'}}>{v}</div>
          </div>)}
        </div>
        <div style={{marginTop:16,paddingTop:14,borderTop:'1px solid var(--border)'}}>
          <div className="dcard-title">Concluídas últimas 24h</div>
          <div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:6}}>
            {tasks.filter(is24h).length===0?<div style={{fontSize:12,color:'var(--text-muted)'}}>Nenhuma ainda</div>
              :tasks.filter(is24h).map(t=><div key={t.ID} style={{fontSize:11,padding:'3px 9px',background:'var(--done-soft)',border:'1px solid #bbf7d0',borderRadius:6,color:'var(--done)',fontWeight:500}}>{t.Nome}</div>)
            }
          </div>
        </div>
      </div>
    </div>
  </div>
}

/* Fallback bar chart sem Recharts */
function SimpleBar({data}){
  const max=Math.max(...data.map(d=>d.Entregas),1);
  return<div style={{display:'flex',alignItems:'flex-end',gap:6,height:160,paddingTop:10}}>
    {data.map((d,i)=><div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:4}}>
      <div style={{fontSize:10,color:'var(--text-dim)',fontWeight:600}}>{d.Entregas||''}</div>
      <div style={{width:'100%',background:'var(--done)',borderRadius:'4px 4px 0 0',height:`${Math.max((d.Entregas/max)*120,d.Entregas>0?6:0)}px`,transition:'height .4s'}}/>
      <div style={{fontSize:9,color:'var(--text-muted)',textAlign:'center',lineHeight:1.2}}>{d.name}</div>
    </div>)}
  </div>
}

function Toast({toasts}){return<div className="tcon">{toasts.map(t=><div key={t.id} className={`toast ${t.type}`}><span>{t.type==='success'?'✓':'✕'}</span>{t.msg}</div>)}</div>}

/* ── APP ── */
function App(){
  const[tasks,setTasks]=useState([]);
  const[loading,setLoading]=useState(true);
  const[tab,setTab]=useState('board'); // board | dash
  const[view,setView]=useState('kanban');
  const[filter,setFilter]=useState('all');
  const[search,setSearch]=useState('');
  const[selected,setSelected]=useState(null);
  const[editing,setEditing]=useState(null);
  const[creating,setCreating]=useState(false);
  const[toasts,setToasts]=useState([]);

  const toast=(msg,type='success')=>{const id=Date.now();setToasts(t=>[...t,{id,msg,type}]);setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),3000)};
  const load=useCallback(async()=>{setLoading(true);try{if(isDemo)setTasks(DEMO);else{const r=await apiCall('list');if(r?.tasks)setTasks(r.tasks)}}catch(e){toast('Erro ao carregar','error');setTasks(DEMO)}setLoading(false)},[]);
  useEffect(()=>{load()},[load]);

  const filtered=tasks.filter(t=>{
    if(filter==='overdue')return isOv(t);
    if(filter==='today')return isTd(t);
    if(filter==='24h')return is24h(t);
    if(filter!=='all')return t.Status===filter;
    return true;
  }).filter(t=>{
    if(!search)return true;
    const q=search.toLowerCase();
    return t.Nome?.toLowerCase().includes(q)||t.Projeto?.toLowerCase().includes(q);
  });

  const stats={
    abertas:tasks.filter(t=>['To Do','Doing'].includes(t.Status)).length,
    doing:tasks.filter(t=>t.Status==='Doing').length,
    atrasadas:tasks.filter(isOv).length,
  };

  const handleSave=async(data)=>{
    if(isDemo){
      if(data.ID)setTasks(ts=>ts.map(t=>t.ID===data.ID?data:t));
      else setTasks(ts=>[{...data,ID:'d_'+Date.now()},...ts]);
      toast(data.ID?'Atualizada':'Criada');
    }else{
      try{if(data.ID)await apiCall('update',{},data);else await apiCall('create',{},data);toast('Salvo ✓');await load()}
      catch(e){toast('Erro','error')}
    }
    setEditing(null);setCreating(false);setSelected(null);
  };
  const handleDelete=async(task)=>{
    if(!confirm(`Remover "${task.Nome}"?`))return;
    if(isDemo){setTasks(ts=>ts.filter(t=>t.ID!==task.ID));toast('Removida')}
    else{try{await apiCall('delete',{},{id:task.ID});toast('Removida');await load()}catch(e){toast('Erro','error')}}
    setSelected(null);
  };

  const FILTERS=[
    ['all','Todas','fa'],['To Do','To Do','ft'],['Doing','Doing','fd'],
    ['StandBy','Stand By','fs'],['Done','Done',''],['overdue','⚠ Atrasadas','fo'],
    ['today','● Hoje','fh'],['24h','✓ Últimas 24h','f24'],
  ];

  return<div className="app">
    <header className="header">
      <div className="logo"><div className="logo-mark">S</div>SEVEN</div>
      <span className="logo-sub">Task Manager</span>
      <div className="hdiv"/>
      <div className="hstats">
        <div className="schip">Abertas <strong>{stats.abertas}</strong></div>
        <div className="schip">Doing <strong>{stats.doing}</strong></div>
        {stats.atrasadas>0&&<div className="schip ov">Atrasadas <strong>{stats.atrasadas}</strong></div>}
      </div>
      {isDemo&&<span className="dbadge">demo</span>}
    </header>

    <div className="navtabs">
      <button className={`ntab${tab==='board'?' active':''}`} onClick={()=>setTab('board')}>Quadro</button>
      <button className={`ntab${tab==='dash'?' active':''}`} onClick={()=>setTab('dash')}>Dashboard</button>
    </div>

    {tab==='board'&&<>
      <div className="toolbar">
        <div className="swrap"><span className="sico">⌕</span><input className="sinput" placeholder="Buscar tarefa ou projeto..." value={search} onChange={e=>setSearch(e.target.value)}/></div>
        <div className="fpills">{FILTERS.map(([val,label,cls])=><button key={val} className={`pill ${cls} ${filter===val?'active':''}`} onClick={()=>setFilter(val)}>{label}</button>)}</div>
        <div className="vtog">
          <button className={`vbtn${view==='kanban'?' active':''}`} onClick={()=>setView('kanban')}>⊞</button>
          <button className={`vbtn${view==='list'?' active':''}`} onClick={()=>setView('list')}>☰</button>
        </div>
        <button className="btn bp" onClick={()=>setCreating(true)}>+ Nova tarefa</button>
      </div>
      <main className="main">
        {isDemo&&<div className="cbanner">⚙ <span><strong>Modo demo</strong> — substitua <code>SEU_SCRIPT_ID_AQUI</code> pela URL do Apps Script.</span></div>}
        {loading?<div className="loading"><div className="spinner"/></div>
          :view==='kanban'?<KanbanView tasks={filtered} onCardClick={setSelected}/>
          :<ListView tasks={filtered} onCardClick={setSelected}/>
        }
      </main>
    </>}

    {tab==='dash'&&<main className="main"><Dashboard tasks={tasks}/></main>}

    {selected&&!editing&&<TaskDetail task={selected} onClose={()=>setSelected(null)} onEdit={t=>{setEditing(t);setSelected(null)}} onDelete={handleDelete}/>}
    {(editing||creating)&&<TaskForm task={editing} onClose={()=>{setEditing(null);setCreating(false)}} onSave={handleSave}/>}
    <Toast toasts={toasts}/>
  </div>
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
